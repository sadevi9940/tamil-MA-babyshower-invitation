<!DOCTYPE html>
<html lang="ta">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#fff6df"
  >

  <title>
    Mariappan & Amirtha Devi — Baby Shower Invitation
  </title>


  <style>

    /* ==================================================
       RESET
    ================================================== */

    * {
      box-sizing: border-box;
    }


    html {
      margin: 0;
      padding: 0;

      width: 100%;
      min-width: 100%;

      scroll-behavior: smooth;
    }


    body {
      margin: 0;
      padding: 0;

      width: 100%;
      min-width: 100%;

      min-height: 0;

      overflow-x: hidden;

      background: #fff6df;

      font-family:
        Georgia,
        "Times New Roman",
        serif;
    }



    /* ==================================================
       PAGE
    ================================================== */

   .page {
  width: 100%;
  min-height: 100svh;

  margin: 0;
  padding: 0;

  display: none;

  justify-content: center;
  align-items: center;

  background: #fff6df;

  opacity: 0;
}

.page.active {
  display: flex;
  opacity: 1;
}

    @keyframes pageIn {

      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }

    }



    /* ==================================================
       INVITATION IMAGE CONTAINER
    ================================================== */

    .invitation {

      position: relative;

      display: block;

      width: 100%;
      max-width: 853px;

      margin: 0 auto;
      padding: 0;

      line-height: 0;

      flex-shrink: 0;
    }


    .invitation img {

      display: block;

      width: 100%;
      max-width: 100%;

      height: auto;

      margin: 0;
      padding: 0;

      border: 0;

      outline: 0;

      user-select: none;

      -webkit-user-drag: none;
    }



    /* ==================================================
       PAGE 1 — OPEN INVITATION BUTTON
    ================================================== */

    .open-hit {

      position: absolute;

      left: 24.5%;
      top: 90.6%;

      width: 51.5%;
      height: 8%;

      padding: 0;
      margin: 0;

      border: 0;

      background: transparent;

      cursor: pointer;

      border-radius: 45px;

      -webkit-tap-highlight-color:
        transparent;

      touch-action: manipulation;

      z-index: 10;
    }


    .open-hit:focus {
      outline: none;
    }


    .open-hit:focus-visible {

      outline:
        3px solid #ffd36b;

      outline-offset: 3px;
    }



    /* ==================================================
       PAGE 2
    ================================================== */

    .second-content {

      display: block;

      width: 100%;
      max-width: 853px;

      margin: 0 auto;
      padding: 0 0 20px 0;

      min-height: 0;
      height: auto;

      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(255, 220, 155, 0.20),
          transparent 38%
        ),
        linear-gradient(
          180deg,
          #fff6df 0%,
          #f7e5c2 100%
        );

      overflow: hidden;
    }



    /* ==================================================
       GOOGLE MAPS CLICK AREA
    ================================================== */

    .map-hit {

      position: absolute;

      left: 55.7%;
      top: 74.6%;

      width: 31.7%;
      height: 7.2%;

      display: block;

      z-index: 20;

      cursor: pointer;

      background: transparent;

      border: 0;

      -webkit-tap-highlight-color:
        transparent;

      touch-action: manipulation;
    }


    .map-hit:focus {
      outline: none;
    }


    .map-hit:focus-visible {

      outline:
        3px solid #ffd36b;

      outline-offset: 3px;
    }



    /* ==================================================
       COUNTDOWN CARD
    ================================================== */

    .countdown-card {

      display: block;

      width:
        calc(100% - 28px);

      max-width: 760px;

      margin:
        18px auto 0;

      padding:
        16px 12px 18px;

      text-align: center;

      border:
        2px solid #d9a53b;

      border-radius: 18px;

      background:
        rgba(255, 250, 235, 0.97);

      box-shadow:
        0 8px 24px
        rgba(72, 0, 20, 0.18);

      line-height: normal;
    }



    /* ==================================================
       COUNTDOWN TITLE
    ================================================== */

    .countdown-title {

      margin:
        0 0 10px 0;

      padding: 0;

      color: #70001f;

      font-size:
        clamp(18px, 3vw, 27px);

      font-weight: 700;

      line-height: 1.25;
    }



    /* ==================================================
       COUNTDOWN GRID
    ================================================== */

    .countdown {

      width: 100%;

      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 8px;

      margin: 0;
      padding: 0;
    }



    /* ==================================================
       TIME BOX
    ================================================== */

    .time-box {

      min-width: 0;

      padding:
        10px 4px;

      border-radius: 12px;

      background: #72001f;

      color: #fff8e8;

      overflow: hidden;
    }


    .time-box .number {

      display: block;

      margin: 0;
      padding: 0;

      font-size:
        clamp(22px, 5vw, 38px);

      line-height: 1;

      font-weight: 700;
    }


    .time-box .label {

      display: block;

      margin:
        5px 0 0;

      padding: 0;

      font-size:
        clamp(10px, 2vw, 13px);

      line-height: 1.2;

      letter-spacing: 0.3px;
    }



    /* ==================================================
       EVENT NOTE
    ================================================== */

    .event-note {

      margin:
        11px 0 0;

      padding: 0;

      color: #5b2b21;

      font-size:
        clamp(12px, 2.2vw, 16px);

      line-height: 1.4;
    }



    /* ==================================================
       BACK BUTTON
    ================================================== */

    .back-btn {

      display: block;

      margin:
        16px auto 0;

      padding:
        11px 22px;

      border:
        1px solid #b88624;

      border-radius: 999px;

      background: #70001f;

      color: #fff8e8;

      font:
        700 15px
        Georgia,
        "Times New Roman",
        serif;

      cursor: pointer;

      -webkit-tap-highlight-color:
        transparent;

      touch-action: manipulation;
    }


    .back-btn:hover {

      filter:
        brightness(1.08);
    }


    .back-btn:focus {
      outline: none;
    }



    /* ==================================================
       MOBILE — MAIN FIX
    ================================================== */

    @media (max-width: 853px) {

  html,
  body {
    width: 100%;
    min-width: 100%;
    margin: 0;
    padding: 0;
    background: #fff6df;
  }

  body {
    overflow-x: hidden;
  }

  .page {
    width: 100vw;
    min-width: 100vw;

    min-height: 100svh;
    height: auto;

    margin: 0;
    padding: 0;

    display: none;

    justify-content: center;
    align-items: center;

    background: #fff6df;
  }

  .page.active {
    display: flex;
  }

  .invitation {
    width: 100vw;
    max-width: 853px;

    margin: 0 auto;
    padding: 0;

    line-height: 0;
  }

  .invitation img {
    display: block;

    width: 100%;
    max-width: 100%;

    height: auto;

    margin: 0;
    padding: 0;
  }
}

      /* -----------------------------------------------
         PAGE 2 CONTAINER
      ------------------------------------------------ */

      .second-content {

        width: 100vw;
        max-width: 100vw;

        min-width: 100vw;

        height: auto;
        min-height: 0;

        margin: 0;
        padding: 0 0 20px 0;

        overflow: visible;

        background:
          linear-gradient(
            180deg,
            #fff6df 0%,
            #f7e5c2 100%
          );
      }



      /* -----------------------------------------------
         COUNTDOWN CARD
      ------------------------------------------------ */

      .countdown-card {

        width:
          calc(100vw - 18px);

        max-width: none;

        margin:
          12px auto 0;

        padding:
          13px 8px 15px;

        border:
          2px solid #d9a53b;

        border-radius: 18px;
      }



      /* -----------------------------------------------
         TITLE
      ------------------------------------------------ */

      .countdown-title {

        margin:
          0 0 10px;

        font-size:
          clamp(18px, 6vw, 25px);

        line-height: 1.25;
      }



      /* -----------------------------------------------
         COUNTDOWN
      ------------------------------------------------ */

      .countdown {

        width: 100%;

        grid-template-columns:
          repeat(4, minmax(0, 1fr));

        gap: 5px;
      }



      /* -----------------------------------------------
         TIME BOX
      ------------------------------------------------ */

      .time-box {

        padding:
          9px 2px;

        border-radius: 11px;
      }


      .time-box .number {

        font-size:
          clamp(22px, 8vw, 32px);
      }


      .time-box .label {

        margin-top: 5px;

        font-size:
          clamp(9px, 2.7vw, 12px);

        line-height: 1.2;

        letter-spacing: 0;
      }



      /* -----------------------------------------------
         EVENT NOTE
      ------------------------------------------------ */

      .event-note {

        margin:
          11px 0 0;

        font-size:
          clamp(12px, 3.4vw, 15px);

        line-height: 1.4;
      }



      /* -----------------------------------------------
         BACK BUTTON
      ------------------------------------------------ */

      .back-btn {

        margin:
          12px auto 0;

        padding:
          11px 20px;

        font-size: 14px;
      }

    }



    /* ==================================================
       VERY SMALL PHONES
    ================================================== */

    @media (max-width: 360px) {

      .countdown-card {

        width:
          calc(100vw - 14px);

        padding:
          11px 6px 13px;
      }


      .countdown {

        gap: 4px;
      }


      .time-box {

        padding:
          8px 1px;

        border-radius: 10px;
      }


      .time-box .number {

        font-size:
          21px;
      }


      .time-box .label {

        font-size:
          8px;
      }


      .event-note {

        font-size:
          11px;
      }


      .back-btn {

        font-size: 13px;

        padding:
          10px 17px;
      }

    }



    /* ==================================================
       DESKTOP
    ================================================== */

    @media (min-width: 854px) {

      html,
      body {

        background: #250009;
      }


      body {

        padding:
          18px 0;
      }


      .page {

        width: 100%;

        min-height: auto;
        height: auto;

        background: transparent;
      }


      .page.active {

        display: flex;
      }


      .invitation {

        box-shadow:
          0 12px 45px
          rgba(0, 0, 0, 0.45);

        border-radius: 14px;

        overflow: hidden;
      }


      .second-content {

        border-radius: 14px;

        overflow: hidden;

        box-shadow:
          0 12px 45px
          rgba(0, 0, 0, 0.45);
      }

    }

  </style>

</head>


<body>


  <!-- ==================================================
       PAGE 1
  ================================================== -->

  <section
    id="page1"
    class="page active"
    aria-label="Invitation cover"
  >

    <div class="invitation">

      <img
        src="page1.png"
        alt="Baby Shower invitation cover"
      >

      <button
        class="open-hit"
        id="openInvitation"
        aria-label="Open Invitation"
      ></button>

    </div>

  </section>



  <!-- ==================================================
       PAGE 2
  ================================================== -->

  <section
    id="page2"
    class="page"
    aria-label="Baby Shower details"
  >

    <div class="second-content">


      <!-- INVITATION IMAGE -->

      <div class="invitation">

        <img
          src="page2.png"
          alt="Baby Shower details for Mariappan and Amirtha Devi"
        >


        <!-- GOOGLE MAPS CLICK AREA -->

        <a
          class="map-hit"
          href="https://maps.app.goo.gl/enHnQbehA4mfrHq37"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Open venue in Google Maps"
        ></a>

      </div>



      <!-- ==================================================
           COUNTDOWN CARD
      ================================================== -->

      <div class="countdown-card">


        <h2 class="countdown-title">
          விழாவிற்கு இன்னும்...
        </h2>


        <div
          class="countdown"
          id="countdown"
          aria-live="polite"
        >


          <!-- DAYS -->

          <div class="time-box">

            <span
              class="number"
              id="days"
            >
              00
            </span>

            <span class="label">
              நாட்கள்
            </span>

          </div>



          <!-- HOURS -->

          <div class="time-box">

            <span
              class="number"
              id="hours"
            >
              00
            </span>

            <span class="label">
              மணிநேரம்
            </span>

          </div>



          <!-- MINUTES -->

          <div class="time-box">

            <span
              class="number"
              id="minutes"
            >
              00
            </span>

            <span class="label">
              நிமிடங்கள்
            </span>

          </div>



          <!-- SECONDS -->

          <div class="time-box">

            <span
              class="number"
              id="seconds"
            >
              00
            </span>

            <span class="label">
              விநாடிகள்
            </span>

          </div>


        </div>



        <!-- EVENT NOTE -->

        <p class="event-note">

          ஞாயிற்றுக்கிழமை,
          13ம் செப்டம்பர் 2026 ·
          காலை 9.30 மணி முதல் —
          நிகழ்ச்சி ஆரம்பம்

        </p>



        <!-- BACK BUTTON -->

        <button
          class="back-btn"
          id="backHome"
        >
          ← அழைப்பிதழுக்கு திரும்பவும்
        </button>


      </div>


    </div>

  </section>



  <!-- ==================================================
       JAVASCRIPT
  ================================================== -->

  <script>


    /* -----------------------------------------------
       PAGE ELEMENTS
    ------------------------------------------------ */

    const page1 =
      document.getElementById("page1");

    const page2 =
      document.getElementById("page2");



    /* -----------------------------------------------
       OPEN INVITATION
    ------------------------------------------------ */

    document
      .getElementById("openInvitation")
      .addEventListener(
        "click",
        function () {

          page1.classList.remove("active");

          page2.classList.add("active");

          window.scrollTo({
            top: 0,
            left: 0,
            behavior: "smooth"
          });

        }
      );



    /* -----------------------------------------------
       BACK TO HOME
    ------------------------------------------------ */

    document
      .getElementById("backHome")
      .addEventListener(
        "click",
        function () {

          page2.classList.remove("active");

          page1.classList.add("active");

          window.scrollTo({
            top: 0,
            left: 0,
            behavior: "smooth"
          });

        }
      );



    /* -----------------------------------------------
       EVENT DATE & TIME
       13 September 2026
       9:30 AM
       India Standard Time
    ------------------------------------------------ */

    const eventTime =
      new Date(
        "2026-09-13T09:30:00+05:30"
      ).getTime();



    /* -----------------------------------------------
       COUNTDOWN FUNCTION
    ------------------------------------------------ */

    function updateCountdown() {


      const remaining =
        eventTime - Date.now();



      /* EVENT STARTED */

      if (remaining <= 0) {

        document
          .getElementById("countdown")
          .innerHTML = `

            <div
              style="
                grid-column: 1 / -1;
                padding: 12px;
                font-size: clamp(18px, 4vw, 28px);
                font-weight: 700;
                line-height: 1.3;
              "
            >
              விழா தொடங்கிவிட்டது! 🎉
            </div>

        `;

        return;
      }



      /* TOTAL SECONDS */

      const totalSeconds =
        Math.floor(
          remaining / 1000
        );



      /* DAYS */

      const days =
        Math.floor(
          totalSeconds / 86400
        );



      /* HOURS */

      const hours =
        Math.floor(
          (totalSeconds % 86400) / 3600
        );



      /* MINUTES */

      const minutes =
        Math.floor(
          (totalSeconds % 3600) / 60
        );



      /* SECONDS */

      const seconds =
        totalSeconds % 60;



      /* UPDATE DAYS */

      document
        .getElementById("days")
        .textContent =
          String(days).padStart(2, "0");



      /* UPDATE HOURS */

      document
        .getElementById("hours")
        .textContent =
          String(hours).padStart(2, "0");



      /* UPDATE MINUTES */

      document
        .getElementById("minutes")
        .textContent =
          String(minutes).padStart(2, "0");



      /* UPDATE SECONDS */

      document
        .getElementById("seconds")
        .textContent =
          String(seconds).padStart(2, "0");

    }



    /* -----------------------------------------------
       START COUNTDOWN
    ------------------------------------------------ */

    updateCountdown();

    setInterval(
      updateCountdown,
      1000
    );


  </script>


</body>

</html>
